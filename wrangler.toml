name = "recipes-pwa"
main = "worker/index.ts"
compatibility_date = "2024-09-23"
workers_dev = true

[[r2_buckets]]
binding = "RECIPES_BUCKET"
bucket_name = "pascals-recipes"
preview_bucket_name = "pascals-recipes"

[vars]
ALLOWED_USERS = "Claudia,Pascal"
# Overridden at deploy time (see scripts/deploy.sh) — COMMIT_SHA with the actual git
# SHA, SW_VERSION with a value that's unique per deploy so the service worker's cache
# always invalidates, even across deploys from an uncommitted working tree.
COMMIT_SHA = "dev"
SW_VERSION = "dev"

[observability.logs]
enabled = true
invocation_logs = true
