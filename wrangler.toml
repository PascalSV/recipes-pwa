name = "recipes-pwa"
main = "worker/index.ts"
compatibility_date = "2024-09-23"
workers_dev = true

[[r2_buckets]]
binding = "RECIPES_BUCKET"
bucket_name = "pascals-recipes-dev"
preview_bucket_name = "pascals-recipes"

[vars]
ALLOWED_USERS = "Claudia,Pascal"

[observability.logs]
enabled = true
invocation_logs = true

[env.remote]
r2_buckets = [
  { binding = "RECIPES_BUCKET", bucket_name = "pascals-recipes", preview_bucket_name = "pascals-recipes" },
]

[env.remote.vars]
ALLOWED_USERS = "Claudia,Pascal"

[env.remote.observability.logs]
enabled = true
invocation_logs = true
