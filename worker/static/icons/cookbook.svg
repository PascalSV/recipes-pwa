<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="coverClip">
      <rect x="130" y="74" width="268" height="356" rx="16"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="512" height="512" fill="#2A9D6E"/>

  <!-- page block (peeks out on the right + bottom) -->
  <rect x="140" y="86" width="272" height="356" rx="16" fill="#F2EFE6"/>
  <rect x="140" y="86" width="272" height="356" rx="16" fill="#000000" opacity="0.06"/>
  <line x1="404" y1="120" x2="404" y2="404" stroke="#123751" stroke-opacity="0.18" stroke-width="4"/>
  <line x1="160" y1="430" x2="392" y2="430" stroke="#123751" stroke-opacity="0.14" stroke-width="4"/>

  <!-- spine -->
  <rect x="104" y="74" width="40" height="356" rx="16" fill="#0C2637"/>

  <!-- cover face -->
  <rect x="130" y="74" width="268" height="356" rx="16" fill="#123751"/>
  <rect x="130" y="74" width="10" height="356" fill="#0C2637" opacity="0.55"/>

  <!-- bookmark ribbon -->
  <path d="M338 74 h34 v104 l-17 -16 -17 16 Z" fill="#F2EFE6"/>
  <path d="M338 74 h34 v104 l-17 -16 -17 16 Z" fill="#000000" opacity="0.05"/>

  <!-- spatula on the cover -->
  <g clip-path="url(#coverClip)"
     fill="#2A9D6E" stroke="#2A9D6E" stroke-width="16"
     stroke-linejoin="round" stroke-linecap="round">
    <polygon points="216,128 312,128 330,224 286,280 242,280 198,224"/>
    <rect x="246" y="264" width="34" height="150" rx="17"/>
  </g>
  <g clip-path="url(#coverClip)" stroke="#123751" stroke-width="12" stroke-linecap="round">
    <line x1="264" y1="150" x2="264" y2="224"/>
    <line x1="231" y1="160" x2="231" y2="210"/>
    <line x1="297" y1="160" x2="297" y2="210"/>
  </g>
</svg>
